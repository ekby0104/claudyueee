<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude 채팅</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 800px;
      padding: 16px 20px;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #4ecca3;
      box-shadow: 0 0 8px #4ecca3;
    }

    header h1 { font-size: 1.1rem; color: #4ecca3; }

    #chat-container {
      flex: 1;
      width: 100%;
      max-width: 800px;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }

    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.6;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: #4ecca3;
      color: #1a1a2e;
      border-bottom-right-radius: 4px;
    }

    .assistant .bubble {
      background: #2a2a4a;
      color: #e0e0e0;
      border-bottom-left-radius: 4px;
    }

    .label {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #4ecca3;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    #input-area {
      width: 100%;
      max-width: 800px;
      padding: 16px 20px;
      border-top: 1px solid #2a2a4a;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #message-input {
      flex: 1;
      background: #2a2a4a;
      border: 1px solid #3a3a6a;
      border-radius: 12px;
      padding: 12px 16px;
      color: #e0e0e0;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      max-height: 150px;
      min-height: 48px;
      line-height: 1.5;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    #message-input:focus { border-color: #4ecca3; }
    #message-input::placeholder { color: #555; }

    #send-btn {
      background: #4ecca3;
      border: none;
      border-radius: 12px;
      width: 48px;
      height: 48px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }

    #send-btn:hover { background: #3ab893; }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { background: #2a2a4a; cursor: not-allowed; }

    #send-btn svg { fill: #1a1a2e; }
    #send-btn:disabled svg { fill: #555; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #444;
      gap: 8px;
    }

    .empty-state .icon { font-size: 2.5rem; }
    .empty-state p { font-size: 0.9rem; }
  </style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>Claude AI 채팅</h1>
</header>

<div id="chat-container">
  <div class="empty-state" id="empty-state">
    <div class="icon">💬</div>
    <p>메시지를 입력해서 대화를 시작하세요</p>
  </div>
</div>

<div id="input-area">
  <textarea
    id="message-input"
    placeholder="메시지를 입력하세요... (Enter로 전송, Shift+Enter로 줄바꿈)"
    rows="1"
  ></textarea>
  <button id="send-btn" title="전송">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
      <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
    </svg>
  </button>
</div>

<script>
  const chatContainer = document.getElementById('chat-container');
  const input = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');
  const emptyState = document.getElementById('empty-state');
  let isStreaming = false;

  // 자동 높이 조절
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 150) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  function addMessage(role, text) {
    emptyState?.remove();

    const wrapper = document.createElement('div');
    wrapper.className = `message ${role}`;

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = role === 'user' ? '나' : 'Claude';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    wrapper.appendChild(label);
    wrapper.appendChild(bubble);
    chatContainer.appendChild(wrapper);
    scrollToBottom();

    return bubble;
  }

  function scrollToBottom() {
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || isStreaming) return;

    isStreaming = true;
    sendBtn.disabled = true;
    input.disabled = true;

    addMessage('user', text);
    input.value = '';
    input.style.height = 'auto';

    // Claude 버블 + 커서
    const assistantBubble = addMessage('assistant', '');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    assistantBubble.appendChild(cursor);

    try {
      const res = await fetch('/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let responseText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = JSON.parse(line.slice(6));

          if (data.text) {
            responseText += data.text;
            assistantBubble.textContent = responseText;
            assistantBubble.appendChild(cursor);
            scrollToBottom();
          }
          if (data.error) {
            assistantBubble.textContent = '오류: ' + data.error;
          }
        }
      }
    } catch (err) {
      assistantBubble.textContent = '연결 오류가 발생했습니다.';
    } finally {
      cursor.remove();
      isStreaming = false;
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
